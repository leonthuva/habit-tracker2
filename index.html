<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #f6f7fd 0%, #eceefc 100%);
      color: #2b2d42;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 3rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(45, 55, 100, 0.12);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .habit-form {
      display: flex;
      gap: 0.6rem;
      margin: 1.5rem 0;
    }

    .habit-form input {
      flex: 1;
      padding: 0.8rem 1.1rem;
      font-size: 1rem;
      color: #2b2d42;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .habit-form input::placeholder {
      color: #a3aec2;
    }

    .habit-form input:focus {
      outline: none;
      border-color: #635bff;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.15);
    }

    .habit-form button {
      padding: 0.8rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #635bff, #7f5fff);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 91, 255, 0.35);
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }

    .habit-form button:hover {
      filter: brightness(1.05);
      box-shadow: 0 6px 16px rgba(99, 91, 255, 0.4);
    }

    .habit-form button:active {
      transform: translateY(1px) scale(0.98);
    }

    #habit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    #habit-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      background: #f8fafc;
      border: 1px solid #eef1f7;
      border-radius: 12px;
      transition: background 0.2s, border-color 0.2s;
    }

    #habit-list li:hover {
      background: #f1f3fd;
      border-color: #dbe0ff;
    }

    #habit-list li input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: #635bff;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    #habit-list li input[type="checkbox"]:hover {
      transform: scale(1.1);
    }

    #habit-list li span {
      flex: 1;
      position: relative;
      display: inline-block;
      color: #334155;
      transition: color 0.3s;
    }

    #habit-list li span::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: #635bff;
      border-radius: 2px;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s ease;
    }

    #habit-list li.done {
      background: #f4f6fa;
    }

    #habit-list li.done span {
      color: #94a3b8;
    }

    #habit-list li.done span::after {
      transform: scaleX(1);
    }

    .delete {
      border: none;
      background: none;
      color: #c0c7d1;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s, transform 0.15s;
    }

    .delete:hover {
      color: #e5484d;
      background: #feebea;
    }

    .delete:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Habit Tracker</h1>

    <form class="habit-form" id="habit-form">
      <input id="habit-input" type="text" placeholder="Add a habit..." autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="habit-list"></ul>
  </main>

  <script>
    const form = document.getElementById("habit-form");
    const input = document.getElementById("habit-input");
    const list = document.getElementById("habit-list");

    let habits = [];
    let nextId = 1;

    function addHabit(name) {
      habits.push({ id: nextId++, name, done: false });
      renderHabits();
    }

    function renderHabits() {
      list.innerHTML = "";
      habits.forEach((habit) => {
        const li = document.createElement("li");
        li.dataset.id = habit.id;
        if (habit.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = habit.done;

        const name = document.createElement("span");
        name.textContent = habit.name;

        const delBtn = document.createElement("button");
        delBtn.className = "delete";
        delBtn.textContent = "x";

        li.append(checkbox, name, delBtn);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      addHabit(value);
      input.value = "";
      input.focus();
    });

    list.addEventListener("click", (e) => {
      const li = e.target.closest("li");
      if (!li) return;

      const habit = habits.find((h) => h.id === Number(li.dataset.id));
      if (!habit) return;

      if (e.target.matches('input[type="checkbox"]')) {
        habit.done = e.target.checked;
        li.classList.toggle("done", e.target.checked);
      }

      if (e.target.classList.contains("delete")) {
        habits = habits.filter((h) => h.id !== habit.id);
        renderHabits();
      }
    });
  </script>
</body>
</html>
